name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Remove node_modules before Jekyll build
        run: rm -rf frontend/node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Copy frontend dist and add SPA fallback
        run: |
          mkdir -p _site/app
          cp -r frontend/dist/* _site/app/ 2>/dev/null || true
          cp _site/app/index.html _site/app/404.html 2>/dev/null || true
          touch _site/.nojekyll 2>/dev/null || true
          echo "app injected: $(ls -lh _site/app/index.html 2>/dev/null || echo MISSING)"
          ls -lh _site/app/ | head -20
          echo "---site root---"
          ls _site/ | head -20
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4